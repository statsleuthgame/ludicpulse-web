name: Shared ETA website

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test eta/app.test.js eta/map-model.test.js
      - run: node --check eta/app.js && node --check eta/map-model.js && node --check eta/verify-mapkit-browser.mjs
